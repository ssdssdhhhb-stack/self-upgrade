<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061326">
<link rel="manifest" href="manifest.json">
<title>SELF UPGRADE</title>
<style>
:root{color-scheme:dark;--bg:#04101f;--panel:#071d34;--line:#12527b;--cyan:#20f3ff;--blue:#168cff;--text:#e9fbff;--muted:#85b6d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#0879b8 0%,#07335e 24%,#04172d 52%,#020914 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding:20px 14px 40px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 10%,#00d9ff20 11%,transparent 12%,transparent 88%,#00d9ff20 89%,transparent 90%);opacity:.6}
main{max-width:570px;margin:auto;position:relative}.top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:10px;letter-spacing:2px;color:var(--cyan);border:1px solid #1bcce8;padding:6px 9px;border-radius:3px;box-shadow:0 0 12px #00d9ff55}
h1{font-size:30px;letter-spacing:3px;margin:22px 0 4px;text-shadow:0 0 18px #00cfff}.sub{color:#9adff3;font-size:11px;letter-spacing:2px}
.panel{background:linear-gradient(145deg,#082a49eF,#061629f2);border:1px solid #1474a3;border-radius:12px;padding:16px;margin-top:15px;box-shadow:0 0 18px #00aaff22,inset 0 0 22px #007db51c}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{color:var(--muted);font-size:10px;letter-spacing:1.5px}.big{font-size:27px;font-weight:800;margin-top:4px}.cyan{color:var(--cyan);text-shadow:0 0 10px #00dfff77}
.bar{height:8px;background:#0c3652;border:1px solid #17658d;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:linear-gradient(90deg,#087dff,#21f7ff);box-shadow:0 0 15px #00eaff;transition:.2s}
h2{font-size:13px;letter-spacing:2px;margin:0 0 12px;color:var(--cyan);text-shadow:0 0 8px #00dfff66}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #16405d}.task:last-child{border:0}.task input{width:21px;height:21px;accent-color:#20eaff;flex-shrink:0}.task span{font-size:14px;line-height:1.45}.task input:checked+span{color:#7c9eb3;text-decoration:line-through}
textarea,input[type=text],input[type=number]{width:100%;background:#031323;border:1px solid #17628a;border-radius:7px;color:white;padding:11px;font:inherit;outline:none}textarea:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 9px #00dfff55}textarea{min-height:70px;resize:vertical}.field{margin-top:12px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}
button{background:linear-gradient(90deg,#087cff,#13d9f5);color:#00101b;border:0;border-radius:6px;padding:12px 15px;font-weight:900;width:100%;margin-top:12px;font-size:13px;letter-spacing:1px}
.note{font-size:10px;line-height:1.7;color:#82b0c8;margin-top:12px}.history-item{padding:10px 0;border-bottom:1px solid #16405d;font-size:12px;line-height:1.6}.history-item:last-child{border:0}.date{color:var(--cyan);font-weight:700}.empty{color:var(--muted);font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center}.month{font-size:11px;color:var(--muted)}
</style>
</head>
<body><main>
<div class="top"><div class="sub">DAILY GROWTH SYSTEM</div><div class="tag">BLUE EDITION</div></div>
<h1>SELF UPGRADE</h1><div class="sub">昨日の自分を、少し超える。</div>
<section class="panel stats">
 <div><div class="small">CURRENT LEVEL</div><div class="big cyan" id="level">LV. 1</div></div>
 <div><div class="small">TOTAL EXPERIENCE</div><div class="big" id="exp">0 XP</div></div>
 <div style="grid-column:1/-1"><div class="section-head"><span class="small">今日の達成率</span><b id="percent" class="cyan">0%</b></div><div class="bar"><div class="fill" id="fill"></div></div></div>
</section>
<section class="panel"><h2>今日のミッション</h2><div id="tasks"></div></section>
<section class="panel"><h2>今日の振り返り</h2>
<div class="field"><label>今日できたこと</label><textarea id="good" placeholder="小さなことでもOK"></textarea></div>
<div class="field"><label>今日の反省・気づき</label><textarea id="reflection" placeholder="次に活かすことを書こう"></textarea></div>
<div class="field"><label>明日意識すること</label><textarea id="next" placeholder="明日の自分へのメモ"></textarea></div>
<div class="field"><label>今日の貯金額（任意・円）</label><input id="saving" type="number" min="0" step="1" placeholder="例：500"></div>
<div class="note">チェックや入力内容は自動で保存されるで。毎日このページを開けば、その日の記録が残るよ。</div>
</section>
<section class="panel"><div class="section-head"><h2>記録を振り返る</h2><span class="month">直近30日</span></div><div id="history"></div></section>
<div class="note">記録はこの端末・このブラウザ内に保存されます。ブラウザのデータを消したり、別の端末で開いたりすると引き継がれません。睡眠・休息も成長の一部。体調や予定に合わせて無理なく続けよう。</div>
</main>
<script>
const tasks=[
["wake","起床・水分補給"],["core","朝の体幹トレーニング"],["run","朝のランニング（体調・予定に合わせて）"],["morning","朝の身支度・スキンケア"],
["school","学校"],["soccer","サッカーの練習"],["strength","筋力トレーニング（予定・体調に合わせて）"],
["care","風呂上がりのスキンケア・ストレッチ"],["laundry","洗濯物を洗う・干す・たたむ"],["study","自主学習"],["review","今日の振り返り・明日の準備"],["save","できる範囲で貯金する"]
];
const dateKey=(d)=>'su-'+d.toLocaleDateString('sv-SE');
const todayKey=()=>dateKey(new Date());
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}};
let state=load(todayKey());
const el=id=>document.getElementById(id);
function persist(){localStorage.setItem(todayKey(),JSON.stringify(state));render();showHistory()}
function completed(){return tasks.filter(t=>state.done?.[t[0]]).length}
function totalExp(){let sum=0;for(let i=0;i<3650;i++){let d=new Date();d.setDate(d.getDate()-i);let v=load(dateKey(d));if(v.done)sum+=Object.values(v.done).filter(Boolean).length*10;}return sum}
tasks.forEach(([id,label])=>{let row=document.createElement('label');row.className='task';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!state.done?.[id];let span=document.createElement('span');span.textContent=label;cb.addEventListener('change',()=>{state.done=state.done||{};state.done[id]=cb.checked;persist()});row.append(cb,span);el('tasks').append(row)});
['good','reflection','next','saving'].forEach(id=>{el(id).value=state[id]??'';el(id).addEventListener('input',e=>{state[id]=e.target.value;localStorage.setItem(todayKey(),JSON.stringify(state));showHistory()})});
function render(){let p=Math.round(completed()/tasks.length*100);el('percent').textContent=p+'%';el('fill').style.width=p+'%';let xp=totalExp();el('exp').textContent=xp+' XP';el('level').textContent='LV. '+(Math.floor(xp/500)+1)}
function showHistory(){let out=[];for(let i=0;i<30;i++){let d=new Date();d.setDate(d.getDate()-i);let k=dateKey(d),v=load(k);if(!localStorage.getItem(k))continue;let count=Object.values(v.done||{}).filter(Boolean).length;let day=k.slice(3);out.push(`<div class="history-item"><span class="date">${day}</span>　${count}/${tasks.length} ミッション達成<br>できたこと：${escapeHtml(v.good||'未記入')}<br>反省：${escapeHtml(v.reflection||'未記入')}<br>明日：${escapeHtml(v.next||'未記入')}<br>貯金：${v.saving?escapeHtml(v.saving)+'円':'未記入'}</div>`)}el('history').innerHTML=out.length?out.join(''):'<div class="empty">記録はまだありません。今日から積み重ねよう。</div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();showHistory();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
